const SUBS = [
  {nome:"Desempenho sob Pressão", itens:[6,18,22,28], inv:[]},

  {nome:"Metas/Preparação Mental", itens:[1,8,13,20],  inv:[]},

  {nome:"Motivação e Confiança",   itens:[2,9,14,26],  inv:[]},

const INTERPS = {
  "Desempenho sob Pressão":"Avalia o quanto o atleta tende a se sentir mais desafiado do que ameaçado nas situações de pressão competitiva.",
  "Lidar com Adversidades":"Avalia o quanto o atleta tende a se manter positivo e calmo, recuperando-se rapidamente dos erros e contratempos.",
  "Metas/Preparação Mental":"Avalia o quanto o atleta trabalha guiado por metas específicas, construindo planos de ação e se preparando mentalmente.",
  "Livre de Preocupação":"Avalia o quanto o atleta tende a não alimentar preocupações desnecessárias em relação ao desempenho.",
  "Concentração":"Avalia o quanto o atleta tende a se manter focado na tarefa, bloqueando distrações internas e externas.",
  "Treinabilidade":"Avalia a abertura do atleta ao aprendizado, lidando bem com críticas construtivas e instruções.",
  "Motivação e Confiança":"Avalia o quanto o atleta confia em suas capacidades e persevera frente a situações negativas.",
};

const CORES = ["#304E38","#C0A258","#8CA591","#5d8a6e","#a07c3e","#4a7a5e","#b08040"];

let view="home", nm="", cat="", respostas=new Array(28).fill(null), q=0, errMsg="";
let entries=[], loaded=false, exp=null, senhaErr="", selAtleta="", filtroAtleta="Todos";

onValue(ref(db,"acsi28"), snap=>{
  entries=[];
  if(snap.exists()) snap.forEach(c=>{ const v=c.val(); if(v&&v.name) entries.push({_k:c.key,...v}); });
  loaded=true; render();
});

const ini=n=>n.trim().split(" ").map(w=>w[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
const pc=v=>v>=75?"pill pok":v>=50?"pill pmid":"pill pbad";
const bc=v=>v>=75?"#27ae60":v>=50?"#C0A258":"#e74c3c";

function calcular(resp){
  const scores = SUBS.map(sub=>{
    const soma = sub.itens.reduce((acc,i)=>{
      const r = resp[i-1];
      const val = sub.inv.includes(i) ? 3-r : r;
      return acc+val;
    },0);
    return {nome:sub.nome, soma, pct:Math.round((soma/12)*100)};
  });
  const totalSoma = scores.reduce((a,s)=>a+s.soma,0);
  const totalPct = Math.round((totalSoma/84)*100);
  const nivel = totalPct>=75?"Alto":totalPct>=50?"Médio":"Baixo";
  return {scores, totalPct, nivel};
}

function radarSVG(scores, W, H){
  const n = scores.length;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)/2 - 60;
  const ang = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i, r) => {
    const a = ang(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gráfico radar ACSI-28 com 7 dimensões">
  <title>Gráfico radar ACSI-28</title>`;

  // Grid
  [25,50,75,100].forEach(pct=>{
    const r = R*(pct/100);
    const pts = scores.map((_,i)=>pt(i,r).join(",")).join(" ");
    svg += `<polygon points="${pts}" fill="none" stroke="#EEE8DA" stroke-width="1"/>`;
    const [lx,ly] = pt(0, r);
    svg += `<text x="${lx+4}" y="${ly}" font-size="8" fill="#bbb" font-family="sans-serif">${pct}%</text>`;
  });

  // Axes
  scores.forEach((_,i)=>{
    const [x,y] = pt(i,R);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EEE8DA" stroke-width="0.8"/>`;
  });

  // Data polygon
  const dataPts = scores.map((s,i)=>pt(i,R*(s.pct/100)).join(",")).join(" ");
  svg += `<polygon points="${dataPts}" fill="rgba(48,78,56,0.15)" stroke="#304E38" stroke-width="2"/>`;

  // Dots
  scores.forEach((s,i)=>{
    const [x,y] = pt(i,R*(s.pct/100));
    svg += `<circle cx="${x}" cy="${y}" r="4" fill="#C0A258"/>`;
  });

  // Labels
  scores.forEach((s,i)=>{
    const a = ang(i);
    const dist = R + 22;
    const lx = cx + dist*Math.cos(a);
    const ly = cy + dist*Math.sin(a);
    const anchor = Math.cos(a) > 0.1 ? "start" : Math.cos(a) < -0.1 ? "end" : "middle";
    const words = s.nome.split(" ");
    const lineh = 11;
    const totalLines = words.length <= 2 ? 1 : 2;
    let line1 = words.length <= 2 ? words.join(" ") : words.slice(0,Math.ceil(words.length/2)).join(" ");
    let line2 = words.length <= 2 ? "" : words.slice(Math.ceil(words.length/2)).join(" ");
    const offsetY = ly - (totalLines-1)*lineh/2;
    svg += `<text x="${lx}" y="${offsetY}" font-size="10" fill="#304E38" font-weight="500" font-family="sans-serif" text-anchor="${anchor}">${line1}</text>`;
    if(line2) svg += `<text x="${lx}" y="${offsetY+lineh}" font-size="10" fill="#304E38" font-weight="500" font-family="sans-serif" text-anchor="${anchor}">${line2}</text>`;
    const cor = bc(s.pct);
    svg += `<text x="${lx}" y="${offsetY+(totalLines)*lineh+2}" font-size="10" fill="${cor}" font-weight="700" font-family="sans-serif" text-anchor="${anchor}">${s.pct}%</text>`;
  });

  svg += `</svg>`;
  return svg;
}

function render(){ document.getElementById("app").innerHTML=html(); bind(); }

function html(){

  if(view==="quiz")    return htmlQuiz();

function htmlDash(){
  const nomes = ["Todos",...new Set(entries.map(e=>e.name))].sort();
  const fil = filtroAtleta==="Todos" ? entries : entries.filter(e=>e.name===filtroAtleta);
  const grp={};
  fil.forEach(d=>{ if(!grp[d.date]) grp[d.date]=[]; grp[d.date].push(d); });
  const dates=Object.keys(grp).sort((a,b)=>b.split("/").reverse().join("-").localeCompare(a.split("/").reverse().join("-")));

  return `<button class="back" id="btn-back">← Voltar</button>
  <div class="screen">
    <div class="dh">
      <div>
        <p style="font-size:11px;color:var(--sg);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin:0">Painel</p>
        <p style="font-size:20px;font-weight:500;color:var(--vd);margin:0">ACSI-28</p>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-s" id="btn-long" style="font-size:12px">📈 Evolução</button>
        <button class="btn-danger" id="btn-clear" style="font-size:12px">Limpar</button>
      </div>
    </div>
    <div class="mgrid">
      <div class="mcard"><p class="ml">Avaliações</p><p class="mv">${fil.length}</p></div>
      <div class="mcard"><p class="ml">Atletas</p><p class="mv">${new Set(fil.map(e=>e.name)).size}</p></div>
    </div>
    <div style="margin-bottom:1rem">
      <label class="fl">Filtrar por atleta</label>
      <select id="sel-filtro">
        ${nomes.map(n=>`<option value="${n}" ${filtroAtleta===n?"selected":""}>${n}</option>`).join("")}
      </select>
    </div>
    ${!loaded?`<p class="loading">Carregando...</p>`:
      fil.length===0?`<div class="empty">Nenhuma avaliação ainda.</div>`:
      dates.map(date=>`
        <p class="dlabel">${date}</p>
        ${grp[date].map(d=>{
          const resps=Array.from({length:28},(_,i)=>d["q"+(i+1)]??0);
          const calc=calcular(resps);
          return `<div class="acard" data-key="${d._k}">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
              <div style="display:flex;align-items:center;gap:10px">
                <div class="av"><span>${ini(d.name)}</span></div>
                <div><p class="aname">${d.name}</p><p class="asub">${d.cat} · ${d.time}</p></div>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="${pc(calc.totalPct)}">${calc.totalPct}%</span>
                <span style="font-size:12px;color:#bbb">${exp===d._k?"▲":"▼"}</span>
              </div>
            </div>
            ${exp===d._k?`<div class="detail">
              ${calc.scores.map(s=>`<div class="brow">
                <span class="blabel">${s.nome}</span>
                <div class="btrack"><div class="bfill" style="width:${s.pct}%;background:${bc(s.pct)}"></div></div>
                <span class="bval" style="color:${bc(s.pct)}">${s.pct}%</span>
              </div>`).join("")}
              <div style="margin-top:10px">
                <button class="btn-p" style="font-size:13px" data-detail="${d._k}">Ver resultado completo</button>
              </div>
            </div>`:""}
          </div>`;
        }).join("")}`).join("")
    }
  </div>`;
}

function htmlDetalhe(){
  const entry = entries.find(e=>e._k===exp);
  if(!entry){ view="dash"; return htmlDash(); }
  const resps = Array.from({length:28},(_,i)=>entry["q"+(i+1)]??0);
  const {scores,totalPct,nivel} = calcular(resps);
  const nivelCor = nivel==="Alto"?"#27ae60":nivel==="Médio"?"#C0A258":"#c0392b";

  return `<button class="back" id="btn-back">← Voltar</button>
  <div class="screen" id="print-area">
    <div class="header">
      <p class="sub">Resultado ACSI-28 · ${entry.date}</p>
      <h1>${entry.name}</h1>
      <p>${entry.cat}</p>
    </div>

    <div style="background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1.25rem;margin-bottom:1rem;text-align:center">
      <p style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Recursos Totais de Coping</p>
      <p style="font-size:52px;font-weight:500;color:var(--vd);line-height:1;margin-bottom:6px">${totalPct}%</p>
      <p style="font-size:14px;font-weight:500;color:${nivelCor}">Nível ${nivel}</p>
    </div>

    <div style="background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1rem;margin-bottom:1rem">
      ${radarSVG(scores, 480, 320)}
    </div>

    <div class="mgrid">
      ${scores.map(s=>`<div class="dim-card">
        <p class="dim-label">${s.nome}</p>
        <p class="dim-valor" style="color:${bc(s.pct)}">${s.pct}%</p>
        <div class="dim-bar"><div class="dim-fill" style="width:${s.pct}%;background:${bc(s.pct)}"></div></div>
      </div>`).join("")}
    </div>

    <div class="interp-box">
      <strong style="color:var(--vd);display:block;margin-bottom:10px;font-size:13px">Interpretação por subescala</strong>
      ${scores.map(s=>`<div style="margin-bottom:10px">
        <p style="font-size:13px;font-weight:500;color:${bc(s.pct)};margin-bottom:3px">${s.nome} — ${s.pct}%</p>
        <p style="font-size:12px;color:#555;line-height:1.5">${INTERPS[s.nome]}</p>
      </div>`).join("")}
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--cr2);font-size:11px;color:#aaa">
        ≥75% = <span style="color:#27ae60">Alto</span> · 50–74% = <span style="color:#C0A258">Médio</span> · &lt;50% = <span style="color:#e74c3c">Baixo</span><br>
        Ref: Coimbra, D.R., Bara Filho, M., Andrade, A., & Miranda, R. (2013). Motricidade, 9(1), 95-106.
      </div>
    </div>

    <button class="btn-print" onclick="window.print()">🖨 Imprimir / Salvar PDF</button>
  </div>`;
}

function htmlLong(){
  const nomes=[...new Set(entries.map(e=>e.name))].sort();
  const atletaData = selAtleta ? entries.filter(e=>e.name===selAtleta).sort((a,b)=>a.date.split("/").reverse().join("-").localeCompare(b.date.split("/").reverse().join("-"))) : [];
  const ultimo = atletaData.length ? atletaData[atletaData.length-1] : null;
  const ultimoScores = ultimo ? calcular(Array.from({length:28},(_,i)=>ultimo["q"+(i+1)]??0)).scores : null;

  return `<button class="back" id="btn-back">← Voltar</button>
  <div class="screen">
    <div class="dh">
      <div>
        <p style="font-size:11px;color:var(--sg);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin:0">Análise Longitudinal</p>
        <p style="font-size:20px;font-weight:500;color:var(--vd);margin:0">Evolução por Atleta</p>
      </div>
    </div>
    <label class="fl">Selecione o atleta</label>
    <select id="sel-atleta">
      <option value="">Selecione...</option>
      ${nomes.map(n=>`<option value="${n}" ${selAtleta===n?"selected":""}>${n}</option>`).join("")}
    </select>
    ${selAtleta&&atletaData.length===0?`<div class="empty">Nenhuma avaliação encontrada.</div>`:""}
    ${selAtleta&&atletaData.length>0?`
      ${ultimoScores?`
        <p class="dlabel" style="margin-bottom:.5rem">Último perfil radar</p>
        <div style="background:#fff;border:1px solid var(--cr2);border-radius:12px;padding:1rem;margin-bottom:1rem">
          ${radarSVG(ultimoScores,440,300)}
        </div>`:""}
      <p class="dlabel">Histórico de avaliações</p>
      ${atletaData.map((d,idx)=>{
        const resps=Array.from({length:28},(_,i)=>d["q"+(i+1)]??0);
        const {scores,totalPct,nivel}=calcular(resps);
        return `<div class="acard" style="cursor:default">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
            <div><p class="aname">Avaliação ${idx+1} — ${d.date}</p><p class="asub">${d.cat}</p></div>
            <span class="${pc(totalPct)}">${totalPct}% · ${nivel}</span>
          </div>
          <div class="detail" style="display:block;padding-top:10px;margin-top:10px">
            ${scores.map(s=>`<div class="brow">
              <span class="blabel">${s.nome}</span>
              <div class="btrack"><div class="bfill" style="width:${s.pct}%;background:${bc(s.pct)}"></div></div>
              <span class="bval" style="color:${bc(s.pct)}">${s.pct}%</span>
            </div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    `:""}
  </div>`;
}

function bind(){
  document.getElementById("btn-iniciar")?.addEventListener("click",()=>{
    nm=document.getElementById("inp-nm")?.value.trim()||"";
    cat=document.getElementById("inp-cat")?.value.trim()||"";
    if(!nm){ errMsg="Por favor, informe o nome."; render(); return; }
    errMsg=""; q=0; respostas=new Array(28).fill(null); view="quiz"; render();
  });
  document.querySelectorAll(".scale-btn[data-v]").forEach(b=>b.addEventListener("click",()=>{ respostas[q]=parseInt(b.dataset.v); errMsg=""; render(); }));
  document.getElementById("btn-next")?.addEventListener("click",async()=>{
    if(respostas[q]===null){ errMsg="Por favor, selecione uma resposta."; render(); return; }
    if(q<27){ q++; errMsg=""; render(); return; }
    const entry={name:nm.trim(),cat,date:new Date().toLocaleDateString("pt-BR"),time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
    respostas.forEach((r,i)=>entry["q"+(i+1)]=r);
    await push(ref(db,"acsi28"),entry);
    view="ok"; render();
  });
  document.getElementById("btn-prev")?.addEventListener("click",()=>{ if(q>0){ q--; errMsg=""; render(); } });
  document.getElementById("btn-back")?.addEventListener("click",()=>{
    if(view==="quiz"||view==="ok"){ view="home"; render(); }
    else if(view==="detalhe"||view==="long"){ view="dash"; render(); }
    else if(view==="dash"){ view="home"; render(); }
    else if(view==="senha"){ view="home"; render(); }
  });
  document.getElementById("btn-dash")?.addEventListener("click",()=>{ senhaErr=""; view="senha"; render(); });
  document.getElementById("btn-entrar")?.addEventListener("click",()=>{
    const v=document.getElementById("inp-senha")?.value||"";
    if(v===SENHA){ view="dash"; render(); } else { senhaErr="Senha incorreta."; render(); }
  });
  document.getElementById("inp-senha")?.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("btn-entrar")?.click(); });
  document.getElementById("sel-filtro")?.addEventListener("change",e=>{ filtroAtleta=e.target.value; render(); });
  document.getElementById("btn-long")?.addEventListener("click",()=>{ selAtleta=""; view="long"; render(); });
  document.getElementById("sel-atleta")?.addEventListener("change",e=>{ selAtleta=e.target.value; render(); });
  document.getElementById("btn-clear")?.addEventListener("click",async()=>{
    if(confirm("Apagar todas as avaliações? Esta ação não pode ser desfeita.")) await remove(ref(db,"acsi28"));
  });
  document.querySelectorAll(".acard[data-key]").forEach(c=>c.addEventListener("click",e=>{
    if(e.target.closest("[data-detail]")) return;
    exp=exp===c.dataset.key?null:c.dataset.key; render();
  }));
  document.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>{ exp=b.dataset.detail; view="detalhe"; render(); }));
}

render();
</script>
</body>
</html>
